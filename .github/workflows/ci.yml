name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  windows:
    name: Windows build, protocols, and packages
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NekoPcbEmulator.slnx

      - name: Build
        run: dotnet build NekoPcbEmulator.slnx -c Release --no-restore -warnaserror

      - name: Test both protocols
        run: dotnet run --project tests/NekoPcbEmulator.ProtocolTests -c Release --no-build -- --report artifacts/protocol-tests/tcp.json

      - name: Publish Windows packages
        run: ./.github/scripts/Publish-Windows.ps1

      - name: Test both published packages
        run: ./.github/scripts/Test-Published.ps1

      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/VERSION.txt
            artifacts/release/RELEASE-NOTES.md

      - name: Upload protocol reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-reports
          if-no-files-found: warn
          path: artifacts/protocol-tests/*.json
