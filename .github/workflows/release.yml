name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-packages
          path: release

      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release/VERSION.txt -Raw).Trim()
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag must match the package version v$version."
          }
          $archives = @(Get-ChildItem release -Filter '*.zip')
          if ($archives.Count -ne 2) { throw 'Expected both Windows package flavors.' }
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  (NekoPcbEmulator-[A-Za-z0-9.-]+\.zip)$') {
              throw 'Invalid checksum manifest entry.'
            }
            $expectedHash = $Matches[1]
            $assetPath = Join-Path release $Matches[2]
            if ((Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash -ine $expectedHash) {
              throw "Checksum mismatch for $assetPath."
            }
          }
          $assets = @($archives.FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "NekoPcbEmulator $env:RELEASE_TAG" --notes-file release/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
